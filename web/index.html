
        <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calculadora Web</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input, select, button { margin: 5px; }
    </style>
</head>
<body>
    <h2>Calculadora Web con Servlets</h2>

    <form action="CalculadoraServlet" method="post">
        <label>Número 1:</label>
        <input type="number" name="num1" step="any" required><br>
            
        <label>Número 2:</label>
        <input type="number" name="num2" step="any" required><br>

        <label>Operación:</label>
        <select name="operacion">
            <option value="suma">Suma</option>
            <option value="resta">Resta</option>
            <option value="multiplicacion">Multiplicación</option>
            <option value="division">División</option>
        </select><br>

        <button type="submit">Calcular</button>
    </form>
</body>
</html>
